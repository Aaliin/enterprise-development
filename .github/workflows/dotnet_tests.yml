name: .NET Tests

on:
  push:
    branches: [main, lab_*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore EstateAgency.sln

      - name: Build
        run: dotnet build EstateAgency.sln --no-restore

      - name: Run tests
        run: dotnet test EstateAgency.Tests/EstateAgency.csproj --no-build
